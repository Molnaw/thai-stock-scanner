name: Thai Stock Scanner

on:
  workflow_dispatch:
  schedule:
    # รอบเช้า: 03:15 UTC = 10:15 น. เวลาไทย (หลังตลาดเปิดเช้า 10:00 น.) จันทร์-ศุกร์
    - cron: '15 3 * * 1-5'
    # รอบเย็น: 09:40 UTC = 16:40 น. เวลาไทย (หลังตลาดปิดเย็น 16:30 น.) จันทร์-ศุกร์
    - cron: '40 9 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas

      - name: Run Thai stock scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python scanner.py
